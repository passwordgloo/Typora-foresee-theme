<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .glass-effect {
            background: rgba(255, 255, 255, 0.8); /* 浅色模式玻璃效果 */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
            padding: 30px;
            transition: all 0.3s ease;
        }
        .glass-effect:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(31, 38, 135, 0.2);
        }
        body {
            position: relative;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background: #f2f2f2; /* 浅色模式背景 */
            overflow: hidden;
        }
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.3); /* 浅色模式磨砂层 */
            filter: blur(15px);
            z-index: -1;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                /* 苹果深色模式颜色方案 - 取消注释以启用对应颜色 */
                
                /* 1. 绿色方案 (iOS系统绿 #34C759) */
                --bg-start: #0a3c2c;
                --bg-end: #134e3e;
                --overlay-start: rgba(52, 199, 89, 0.2);
                --overlay-end: rgba(52, 199, 89, 0.3);
                --glass-bg: rgba(10, 60, 44, 0.3);
                
                /* 2. 蓝色方案 (iOS系统蓝 #007AFF) */
                /* --bg-start: #001f3f; */
                /* --bg-end: #003366; */
                /* --overlay-start: rgba(0, 122, 255, 0.2); */
                /* --overlay-end: rgba(0, 122, 255, 0.3); */
                /* --glass-bg: rgba(0, 31, 63, 0.3); */
                
                /* 3. 桃红色方案 (iOS系统粉红 #FF2D55) */
                /* --bg-start: #3f0e2d; */
                /* --bg-end: #5c1a45; */
                /* --overlay-start: rgba(255, 45, 85, 0.2); */
                /* --overlay-end: rgba(255, 45, 85, 0.3); */
                /* --glass-bg: rgba(63, 14, 45, 0.3); */
                
                /* 4. 紫色方案 (iOS系统紫 #AF52DE) */
                /* --bg-start: #2a1437; */
                /* --bg-end: #3d1b55; */
                /* --overlay-start: rgba(175, 82, 222, 0.2); */
                /* --overlay-end: rgba(175, 82, 222, 0.3); */
                /* --glass-bg: rgba(42, 20, 55, 0.3); */
                
                /* 5. 橙色方案 (iOS系统橙 #FF9500) */
                /* --bg-start: #3d210b; */
                /* --bg-end: #5c3614; */
                /* --overlay-start: rgba(255, 149, 0, 0.2); */
                /* --overlay-end: rgba(255, 149, 0, 0.3); */
                /* --glass-bg: rgba(61, 33, 11, 0.3); */
            }
            body {
                background: #323232; /* 深色模式背景 */
            }
            body::before {
                background: rgba(0, 0, 0, 0.2); /* 深色模式磨砂层 */
            }
            .glass-effect {
                background: var(--glass-bg);
                border-color: rgba(255, 255, 255, 0.1);
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            }
            h2, p {
                color: #ffffff;
            }
        }
    </style>
</head>

<body>
    <div class="glass-effect">
        <h2>液态玻璃卡片</h2>
        <p>这是一个具有玻璃效果的内容区域。</p>
    </div>
</body>

</html>
